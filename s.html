<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #d43b15);
    }

    .form-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-size: 14px;
      color: #555;
    }

    input, textarea, select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102,126,234,0.5);
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }
  </style>
</head>

<body>

  <form class="form-container" action="#">
    <h2>Sifariş Formu</h2>

    <div class="form-group">
      <label for="name">Adınız</label>
      <input type="text" id="name" placeholder="Adınızı daxil edin" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Email daxil edin" required>
    </div>

    <div class="form-group">
      <label for="phone">Telefon</label>
      <input type="tel" id="phone" placeholder="Telefon nömrəsi" required>
    </div>

    <div class="form-group">
      <label for="product">Məhsul seçin</label>
      <select id="product" required>
        <option value="">Seçin</option>
        <option>Laptop</option>
        <option>Telefon</option>
        <option>Qulaqlıq</option>
      </select>
    </div>

    <div class="form-group">
      <label for="address">Ünvan</label>
      <textarea id="address" placeholder="Ünvanınızı yazın" required></textarea>
    </div>

    <button type="submit">Sifariş et</button>
  </form>

</body>
</html>
